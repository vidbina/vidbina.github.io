name: Blurt
title: Blurt
description: Engineer, dreamer, observer, musician
author: David Asabina
markdown: kramdown
highlighter: rouge
gems:
  - jekyll-redirect-from
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
paginate: 50
disqus_shortname: vidbina
permalink: /:categories/:title/
url: https://vid.bina.me
plugins:
  - jemoji
# Feed readers do not run js/embed-consent.js, so full post HTML could load
# third parties without consent. The feed carries excerpts only.
feed:
  excerpt_only: true
# Setting exclude replaces the defaults, so they are listed here as well.
exclude:
  - .jekyll-cache
  - .sass-cache
  - AGENTS.md
  - CHANGELOG.md
  - CLAUDE.local.md
  - CLAUDE.md
  - CNAME
  - CONTRIBUTING.md
  - GEMINI.md
  - Makefile
  - Gemfile
  - Gemfile.lock
  - README.md
  - Rakefile
  - blank.html
  - docs
  - gemfiles
  - js/MathJax/docs
  - js/MathJax/test
  - js/MathJax/unpacked
  - node_modules
  - schemas
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
