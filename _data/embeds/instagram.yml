# The gate in js/embed-consent.js reads name, operator, policy and version.
# _includes/csp.html adds the csp sources to pages that gate this provider.
name: Instagram
operator: Meta
policy: https://privacycenter.instagram.com/policy
version: 1
csp:
  script-src: https://www.instagram.com
  frame-src: https://www.instagram.com
